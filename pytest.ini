[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Timeout settings (per constitution)
timeout = 30  # 30 seconds default timeout for tests

# Markers for different test types
markers =
    unit: Unit tests (isolated module testing)
    integration: Integration tests (multi-module, real ES)
    contract: Contract tests (external API verification)
    accuracy: End-to-end query accuracy tests (require live ES + LLM)
    single_index: Single-index accuracy tests
    multi_index: Multi-index join accuracy tests
    slow: Tests that take longer than 5 seconds

# Coverage settings (when using pytest-cov)
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
